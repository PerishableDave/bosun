# Publishes a release when a v* tag is pushed:
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# GoReleaser builds the darwin/linux x amd64/arm64 archives and checksums,
# creates the GitHub release (with install.sh attached), pushes multi-arch
# images to ghcr.io/perishabledave/bosun, and commits the Homebrew formula to
# perishabledave/homebrew-tap.
#
# Required repository secret:
#   HOMEBREW_TAP_GITHUB_TOKEN  a fine-grained personal access token with
#                              "Contents: Read and write" on
#                              perishabledave/homebrew-tap only. The built-in
#                              GITHUB_TOKEN cannot push to another repository.
# GHCR uses the built-in GITHUB_TOKEN (packages: write below).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release
  packages: write   # push to ghcr.io

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # changelog and version need the full history and tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race -count=1 ./...

      - uses: docker/setup-qemu-action@v3    # build the arm64 image on amd64
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
