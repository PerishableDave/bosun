# bosun.yaml for the Docker image.
#
# The container entrypoint copies this file to /data/bosun.yaml on first run
# (only when that file does not exist yet). Edit /data/bosun.yaml afterwards,
# e.g. `docker compose exec bosun vi /data/bosun.yaml`, then
# `docker compose restart bosun`.
#
# Secrets never go in this file: API keys come from the environment (see
# compose.yml) and account passwords live in the encrypted vault.

daemon:
  # Listen on all interfaces *inside the container*. compose.yml publishes the
  # port on the host's loopback (127.0.0.1:7777) only; put Tailscale Serve or
  # a reverse proxy in front for other devices (see docs/DEPLOY.md).
  listen: 0.0.0.0:7777
  data_dir: /data

  # Default: TLS on. bosund requires TLS on any non-loopback listen address,
  # so the entrypoint generates a self-signed certificate in /data/tls/ on
  # first run (valid for "bosun", "localhost" and 127.0.0.1). This is the safe
  # default if the port is ever exposed without a proxy; proxies talk HTTPS
  # to it (Caddy: tls_insecure_skip_verify; Tailscale: https+insecure://).
  tls:
    enabled: true
    cert_file: /data/tls/cert.pem
    key_file: /data/tls/key.pem

  # Proxy setups: the switch to plain HTTP behind a TLS-terminating proxy
  # (Caddy, Tailscale Serve). To use it, set `behind_proxy: true` below AND
  # `tls.enabled: false` above (the two are mutually exclusive), then proxy to
  # bosun:7777 (`reverse_proxy bosun:7777`, `tailscale serve --bg 7777`).
  # behind_proxy makes bosund honour X-Forwarded-* headers from
  # trusted_proxies only (default: loopback and private ranges, which covers
  # the compose network). Keep the published port on 127.0.0.1.
  # behind_proxy: true
  # trusted_proxies: [172.16.0.0/12]

  web_ui: true
  # The vault master key is kept in /data/master.key (there is no OS keychain
  # in a container). Back up the volume to keep your credentials readable.
  master_key: file
  # timezone: Europe/Madrid    # for routine schedules; default is UTC here

llm:
  # A local model by default (start the "ollama" profile and pull it:
  # `docker compose exec ollama ollama pull llama3.1`). To use Anthropic
  # instead, set ANTHROPIC_API_KEY for the bosun service and change this to
  # e.g. anthropic/claude-sonnet-5-5.
  default: ollama/llama3.1
  providers:
    ollama:
      base_url: http://ollama:11434
    anthropic:
      api_key_env: ANTHROPIC_API_KEY

integrations:
  websearch:
    enabled: true
    backend: searxng
    # The "searxng" compose profile; websearch.fetch works without it.
    base_url: http://searxng:8080
  email:
    enabled: true
  calendar:
    enabled: true

channels:
  telegram:
    # Disabled until a bot token exists, so first-run `bosun doctor` is clean.
    # Store the token in the vault with
    # `bosun credentials set channels telegram_bot_token --shared` (or set
    # TELEGRAM_BOT_TOKEN for the bosun service), then change this to true and
    # `docker compose restart bosun`.
    enabled: false
    token_env: TELEGRAM_BOT_TOKEN

policy:
  defaults:
    read: allow
    write: ask
    destructive: ask
  approval_timeout: 15m
